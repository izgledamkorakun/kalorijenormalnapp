<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f0e">
<meta name="description" content="Osobni dnevnik kalorija: unosi na 100 g, dnevni ciljevi, kalendar, BMI i praćenje kilaže.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalorije">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%97%3C/text%3E%3C/svg%3E">
<title>Kalorije — dnevnik prehrane</title>
<style>
  :root{
    --bg:#0d0f0e; --card:#171b18; --card2:#1d221e; --line:#2a312b;
    --txt:#e9efe9; --mut:#8d9a90; --acc:#8fe04a; --acc-dim:#5f9a34;
    --teal:#4ad9c0; --amber:#ffc03a; --red:#ff6b6b; --violet:#b48cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 85% -12%, rgba(143,224,74,.13), transparent 60%),
      radial-gradient(700px 400px at -10% 10%, rgba(74,217,192,.08), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    line-height:1.45;
    min-height:100vh;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:16px}
  .wrap{max-width:940px;margin:0 auto;padding:16px 14px 64px}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .brand{font-weight:700;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  .brand small{font-weight:500;font-size:11px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
  .tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:14px;overflow-x:auto;max-width:100%}
  .tabs button{background:none;border:0;color:var(--mut);padding:8px 13px;border-radius:10px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:.15s}
  .tabs button:hover{color:var(--txt)}
  .tabs button.on{background:var(--acc);color:#0b1206}

  /* ---------- cards ---------- */
  .card{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)) ,var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 12px;font-weight:700}
  .muted{color:var(--mut);font-size:13px}
  .warn{display:none;background:rgba(255,192,58,.1);border:1px solid rgba(255,192,58,.35);color:#ffd684;padding:10px 14px;border-radius:14px;font-size:13px;margin-bottom:12px}

  /* ---------- day head ---------- */
  .dayhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.daysub{display:flex;gap:8px;align-items:center;flex:0 0 auto;margin-left:auto}
  .navbtn{width:40px;height:40px;flex:0 0 auto;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:19px;line-height:1;display:grid;place-items:center}
  .navbtn:hover{border-color:var(--acc-dim);color:var(--acc)}
  .daytitle{flex:1 1 140px;min-width:0}
  .daytitle .d1{font-size:17px;font-weight:700;letter-spacing:-.01em}
  .daytitle .d2{font-size:12.5px;color:var(--mut)}
  .datepick{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:8px 10px;font-size:13px;width:auto;max-width:158px;flex:0 0 auto}

  /* ---------- kcal hero ---------- */
  .hero{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
  .hero .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .hero .big span{font-size:16px;font-weight:600;color:var(--mut);letter-spacing:0}
  .hero .rem{font-size:13.5px;margin-top:6px}
  .hero .rem.over{color:var(--red)}
  .hero .rem.ok{color:var(--acc)}
  .ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--acc) calc(var(--p)*1%), #242b26 0);
    position:relative}
  .ring::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--card)}
  .ring b{position:relative;z-index:1;font-size:19px;font-weight:800}
  .bar{height:7px;border-radius:99px;background:#232a25;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .3s}

  /* ---------- stats ---------- */
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
  .stat{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
  .stat .sl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .sv{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
  .stat .sv em{font-style:normal;font-size:12px;font-weight:600;color:var(--mut);margin-left:2px}
  .stat .st{font-size:11.5px;color:var(--mut);margin-top:1px}

  /* ---------- meals ---------- */
  .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .mtitle{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:7px}
  .mdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .mkcal{font-size:13px;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}
  .empty{color:var(--mut);font-size:13px;padding:6px 0 2px}
  .erow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.05)}
  .erow:first-of-type{border-top:0}
  .ename{font-weight:600;font-size:14px}
  .star{color:var(--acc);display:inline-flex;vertical-align:-1px}
  .mini svg{width:14px;height:14px;display:block}
  .emac{font-size:11.5px;color:var(--mut);margin-top:1px}
  .ekcal{font-weight:700;font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
  .egrams{font-size:11px;color:var(--mut);text-align:right}
  .eact{display:flex;gap:4px}
  .mini{width:30px;height:30px;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--mut);display:grid;place-items:center;font-size:13px}
  .mini:hover{color:var(--txt);border-color:var(--acc-dim)}
  .addbtn{width:100%;margin-top:10px;background:rgba(143,224,74,.07);border:1px dashed rgba(143,224,74,.35);color:var(--acc);padding:9px;border-radius:12px;font-weight:600;font-size:13.5px}
  .addbtn:hover{background:rgba(143,224,74,.14)}

  /* ---------- forms ---------- */
  label.fld{display:block;margin-bottom:10px}
  label.fld > span{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:5px}
  input[type=text],input[type=number],input[type=date],select{
    width:100%;background:#111512;border:1px solid var(--line);color:var(--txt);
    border-radius:11px;padding:10px 12px;outline:none;transition:.15s;
  }
  input:focus,select:focus{border-color:var(--acc-dim);box-shadow:0 0 0 3px rgba(143,224,74,.1)}
  .frow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .frow3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .frow5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .btn{background:var(--acc);color:#0b1206;border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--acc-dim);color:var(--acc)}
  .btn.small{padding:8px 13px;font-size:13px;border-radius:10px}
  .btn.danger{background:rgba(255,107,107,.12);color:var(--red);border:1px solid rgba(255,107,107,.35)}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

  /* ---------- modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(4,6,5,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
  .modal.hidden{display:none}
  .modalbox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .modalbox h3{margin:0 0 14px;font-size:18px;letter-spacing:-.01em}
  .preview{background:#101410;border:1px solid var(--line);border-radius:14px;padding:12px;margin:4px 0 12px;text-align:center}
  .pv-main{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .pv-main span{font-size:13px;color:var(--mut);font-weight:600}
  .pv-mac{font-size:12px;color:var(--mut);margin-top:3px}
  .check{display:flex;gap:9px;align-items:flex-start;background:#101410;border:1px solid var(--line);border-radius:13px;padding:11px 12px;cursor:pointer}
  .check input{margin-top:3px;width:17px;height:17px;accent-color:var(--acc);flex:0 0 auto}
  .check .ct{font-size:13px;font-weight:600}
  .check .cd{font-size:11.5px;color:var(--mut);margin-top:1px}
  .hint{font-size:11.5px;color:var(--acc);min-height:0;margin:-4px 0 8px}
  .libhint{font-size:11.5px;color:var(--acc);margin:-4px 0 8px}

  /* ---------- calendar ---------- */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .calhead .mtitle{font-size:16px}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .dow div{text-align:center;font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cday{min-height:66px;border-radius:12px;background:var(--card2);border:1px solid transparent;color:var(--txt);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;transition:.15s;overflow:hidden}
  .cday:hover{border-color:var(--acc-dim)}
  .cday.pad{background:transparent;border:0;pointer-events:none}
  .cnum{font-size:13.5px;font-weight:700;line-height:1}
  .ckcal{font-size:9.5px;font-weight:700;opacity:.95;font-variant-numeric:tabular-nums}
  .wd{width:5px;height:5px;border-radius:50%;background:var(--teal);margin-top:1px;flex:0 0 auto}
  .cday.empty{background:#141815;color:#5d6a60}
  .cday.good{background:rgba(143,224,74,.16);border-color:rgba(143,224,74,.35);color:#d9f7bf}
  .cday.near{background:rgba(255,192,58,.16);border-color:rgba(255,192,58,.4);color:#ffe6ab}
  .cday.over{background:rgba(255,107,107,.15);border-color:rgba(255,107,107,.38);color:#ffc9c9}
  .cday.today{box-shadow:0 0 0 2px var(--acc) inset}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--mut)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

  /* ---------- weight ---------- */
  .bmi{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .bmi .val{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .pill{display:inline-block;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700}
  .pill.n{background:rgba(143,224,74,.15);color:var(--acc)}
  .pill.w{background:rgba(255,192,58,.15);color:var(--amber)}
  .pill.o{background:rgba(255,107,107,.15);color:var(--red)}
  .pill.b{background:rgba(74,217,192,.15);color:var(--teal)}
  .wrow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.05);font-size:13.5px}
  .wrow:first-child{border-top:0}
  .delta{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .delta.down{color:var(--acc)} .delta.up{color:var(--amber)} .delta.zero{color:var(--mut)}
  .chart{margin-top:6px}
  .chart svg{width:100%;height:auto;display:block}

  /* ---------- misc ---------- */
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--acc);color:#0b1206;
    padding:11px 20px;border-radius:99px;font-weight:700;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .foodrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid rgba(255,255,255,.05)}
  .foodrow:first-of-type{border-top:0}
  .fname{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tag{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;background:rgba(143,224,74,.14);color:var(--acc);padding:2px 7px;border-radius:99px;font-weight:700}
  .fmac{font-size:11.5px;color:var(--mut);margin-top:2px}

  @media (max-width:640px){
    .grid4{grid-template-columns:repeat(2,1fr)}
    .hero .big{font-size:36px}
    .frow5{grid-template-columns:repeat(2,1fr)}
    .frow3{grid-template-columns:repeat(2,1fr)}
    .erow{grid-template-columns:1fr auto;grid-template-areas:"info info" "kcalc act";row-gap:5px;padding:11px 0}
    .erow > div:first-child{grid-area:info}
    .erow > div:nth-child(2){grid-area:kcalc;display:flex;align-items:baseline;gap:8px;text-align:left}
    .erow > .eact{grid-area:act}
    .ekcal{font-size:13.5px}
    .egrams{text-align:left}
    .emac{font-size:11px;line-height:1.35}
    .wrap{padding:12px 11px 56px}
    .tabs{width:100%;overflow:visible;flex-wrap:nowrap}
    .tabs button{flex:1 1 auto;padding:8px 6px;font-size:12.5px}
    .cday{min-height:58px;border-radius:10px}
    .datepick{max-width:145px}
    .modalbox{padding:16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="8" fill="#8fe04a"/><path d="M12 6c0-2.2 1.6-3.4 3.4-3.4" stroke="#8fe04a" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M8 14.5c1 1.4 2.4 2.1 4 2.1s3-.7 4-2.1" stroke="#0d0f0e" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg> Kalorije <small id="brandsub">dnevnik</small></div>
    <nav class="tabs">
      <button data-tab="day" onclick="setView('day')">Danas</button>
      <button data-tab="calendar" onclick="setView('calendar')">Kalendar</button>
      <button data-tab="foods" onclick="setView('foods')">Namirnice</button>
      <button data-tab="weight" onclick="setView('weight')">Težina</button>
      <button data-tab="settings" onclick="setView('settings')">Ciljevi</button>
    </nav>
  </div>

  <div class="warn" id="storewarn">
    ⚠️ Pregled ne dopušta trajno spremanje podataka. Otvori aplikaciju u pravom pregledniku (ili je hostaj) da bi se unosi pamtili.
  </div>

  <main id="view"></main>
</div>

<div class="modal hidden" id="modal"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============================================================
   KONSTANTE
   ============================================================ */
const KEY = "kalorije_v1";

const MEALS = [
  { id: "breakfast", label: "Doručak", color: "var(--amber)"  },
  { id: "snack",     label: "Užina",   color: "var(--violet)" },
  { id: "lunch",     label: "Ručak",   color: "var(--acc)"    },
  { id: "dinner",    label: "Večera",  color: "var(--teal)"   }
];
const mealLabel = id => (MEALS.find(m => m.id === id) || {}).label || id;

const NUT = [
  { k: "fat",     l: "Masti",         u: "g" },
  { k: "carbs",   l: "Ugljikohidrati",u: "g" },
  { k: "fiber",   l: "Vlakna",        u: "g" },
  { k: "protein", l: "Proteini",      u: "g" }
];

const ICON = {
  pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  star: '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="m12 2 2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8Z"/></svg>'
};

const GOALKEY = { kcal:"kcalGoal", fat:"fatGoal", carbs:"carbGoal", fiber:"fiberGoal", protein:"proteinGoal" };

const DEFAULT_SETTINGS = {
  kcalGoal: 2000, fatGoal: 70, carbGoal: 220, fiberGoal: 30, proteinGoal: 120,
  height: null, goalWeight: null, startWeight: null
};

const MONTHS = ["siječnja","veljače","ožujka","travnja","svibnja","lipnja","srpnja","kolovoza","rujna","listopada","studenoga","prosinca"];
const MONTHS_NOM = ["Siječanj","Veljača","Ožujak","Travanj","Svibanj","Lipanj","Srpanj","Kolovoz","Rujan","Listopad","Studeni","Prosinac"];
const DAYS = ["nedjelja","ponedjeljak","utorak","srijeda","četvrtak","petak","subota"];
const DAYS_SHORT = ["Ned","Pon","Uto","Sri","Čet","Pet","Sub"];

/* ============================================================
   STORAGE
   ============================================================ */
const store = {
  ok: true,
  get() { try { return localStorage.getItem(KEY); } catch (e) { this.ok = false; return null; } },
  set(v) { try { localStorage.setItem(KEY, v); } catch (e) { this.ok = false; } }
};

function load() {
  let raw = null;
  try { raw = JSON.parse(store.get()); } catch (e) { raw = null; }
  const s = (raw && typeof raw === "object") ? raw : {};
  return {
    entries: s.entries && typeof s.entries === "object" ? s.entries : {},
    foods: Array.isArray(s.foods) ? s.foods : [],
    weights: s.weights && typeof s.weights === "object" ? s.weights : {},
    settings: Object.assign({}, DEFAULT_SETTINGS, s.settings || {})
  };
}
function save() { store.set(JSON.stringify(state)); }

let state = load();
let view = "day";
let currentDate = todayStr();
let calMonth = todayStr().slice(0, 7);

/* ============================================================
   HELPERI
   ============================================================ */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));

function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function fmtDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayStr() { return fmtDate(new Date()); }
function parseDate(ds) { const p = String(ds).split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(ds, n) { const d = parseDate(ds); d.setDate(d.getDate() + n); return fmtDate(d); }
function longDate(ds) {
  const d = parseDate(ds);
  return DAYS[d.getDay()].charAt(0).toUpperCase() + DAYS[d.getDay()].slice(1) + ", " + d.getDate() + ". " + MONTHS[d.getMonth()] + " " + d.getFullYear() + ".";
}
function shortDate(ds) {
  const d = parseDate(ds);
  return d.getDate() + ". " + (d.getMonth() + 1) + ". " + d.getFullYear() + ".";
}
function parseNum(v) {
  if (v === null || v === undefined) return 0;
  const n = parseFloat(String(v).replace(/\s/g, "").replace(",", "."));
  return isFinite(n) ? n : 0;
}
function nf(n, d) {
  d = d || 0;
  if (!isFinite(n)) n = 0;
  return Number(n).toLocaleString("hr-HR", { minimumFractionDigits: d, maximumFractionDigits: d });
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 1900);
}

/* ============================================================
   IZRAČUNI
   ============================================================ */
function entryMacros(e) {
  const f = (Number(e.grams) || 0) / 100;
  const p = e.per100 || {};
  return {
    kcal:    (Number(p.kcal) || 0) * f,
    fat:     (Number(p.fat) || 0) * f,
    carbs:   (Number(p.carbs) || 0) * f,
    fiber:   (Number(p.fiber) || 0) * f,
    protein: (Number(p.protein) || 0) * f
  };
}
function totalsOf(list) {
  const t = { kcal: 0, fat: 0, carbs: 0, fiber: 0, protein: 0 };
  (list || []).forEach(e => {
    const m = entryMacros(e);
    for (const k in t) t[k] += m[k];
  });
  return t;
}
function dayEntries(ds) { return state.entries[ds] || []; }
function sortedWeightDates() { return Object.keys(state.weights).sort(); }
function latestWeight() {
  const d = sortedWeightDates();
  return d.length ? { date: d[d.length - 1], kg: Number(state.weights[d[d.length - 1]]) } : null;
}
function firstWeight() {
  const d = sortedWeightDates();
  return d.length ? { date: d[0], kg: Number(state.weights[d[0]]) } : null;
}
function bmiInfo() {
  const w = latestWeight();
  const h = Number(state.settings.height);
  if (!w || !h) return null;
  const m = h / 100;
  const bmi = w.kg / (m * m);
  let label, cls;
  if (bmi < 18.5) { label = "Pothranjenost"; cls = "b"; }
  else if (bmi < 25) { label = "Normalna težina"; cls = "n"; }
  else if (bmi < 30) { label = "Prekomjerna težina"; cls = "w"; }
  else { label = "Pretilost"; cls = "o"; }
  return { bmi, label, cls };
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  $$(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === view));
  const el = $("#view");
  if (view === "day") el.innerHTML = viewDay();
  else if (view === "calendar") el.innerHTML = viewCalendar();
  else if (view === "foods") el.innerHTML = viewFoods();
  else if (view === "weight") el.innerHTML = viewWeight();
  else el.innerHTML = viewSettings();

  $("#storewarn").style.display = store.ok ? "none" : "block";
  $("#brandsub").textContent = view === "day" ? "dnevnik" : "";
}
function setView(v) { view = v; if (v === "day") calMonth = currentDate.slice(0, 7); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function goDay(ds) { currentDate = ds; calMonth = ds.slice(0, 7); view = "day"; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function shiftDay(n) { goDay(addDays(currentDate, n)); }

/* ---------- DANAS ---------- */
function viewDay() {
  const list = dayEntries(currentDate);
  const t = totalsOf(list);
  const s = state.settings;
  const goal = Number(s.kcalGoal) || 0;
  const pct = goal > 0 ? Math.min(100, (t.kcal / goal) * 100) : 0;
  const rem = goal - t.kcal;
  const isToday = currentDate === todayStr();

  let html = "";
  html += `<div class="dayhead">
    <button class="navbtn" onclick="shiftDay(-1)" title="Prethodni dan">‹</button>
    <div class="daytitle">
      <div class="d1">${isToday ? "Danas" : longDate(currentDate).split(",")[0]}</div>
      <div class="d2">${longDate(currentDate)}</div>
    </div>
    <button class="navbtn" onclick="shiftDay(1)" title="Sljedeći dan">›</button>
    <div class="daysub">
      <input class="datepick" type="date" value="${currentDate}" onchange="if(this.value)goDay(this.value)">
      ${isToday ? "" : `<button class="btn ghost small" onclick="goDay('${todayStr()}')">Danas</button>`}
    </div>
  </div>`;

  html += `<div class="card">
    <div class="hero">
      <div>
        <div class="big">${nf(t.kcal)}<span> kcal</span></div>
        <div class="rem ${rem < 0 ? "over" : "ok"}">${goal > 0 ? (rem >= 0 ? "još " + nf(rem) + " kcal do cilja" : nf(-rem) + " kcal preko cilja") : "postavi dnevni cilj u kartici Ciljevi"}</div>
      </div>
      <div class="ring" style="--p:${pct}"><b>${goal > 0 ? Math.round((t.kcal / goal) * 100) + "%" : "—"}</b></div>
    </div>
    <div class="bar"><i style="width:${pct}%;background:${rem < 0 ? "var(--red)" : "var(--acc)"}"></i></div>
    <div class="muted" style="margin-top:8px">Cilj: ${goal > 0 ? nf(goal) + " kcal" : "nije postavljen"} · ${nf(t.kcal)} kcal pojedeno</div>
  </div>`;

  html += `<div class="grid4">`;
  NUT.forEach(n => {
    const val = t[n.k];
    const g = Number(s[GOALKEY[n.k]]) || 0;
    const p = g > 0 ? Math.min(100, (val / g) * 100) : 0;
    const over = g > 0 && val > g;
    html += `<div class="stat">
      <div class="sl">${n.l}</div>
      <div class="sv">${nf(val, 1)}<em>g</em></div>
      <div class="st">${g > 0 ? "od " + nf(g) + " g" : "bez cilja"}</div>
      <div class="bar"><i style="width:${p}%;background:${over ? "var(--red)" : "var(--acc)"}"></i></div>
    </div>`;
  });
  html += `</div>`;

  MEALS.forEach(m => {
    const ml = list.filter(e => e.meal === m.id);
    const mt = totalsOf(ml);
    html += `<section class="card">
      <div class="mhead">
        <div class="mtitle"><span class="mdot" style="background:${m.color}"></span>${m.label}</div>
        <div class="mkcal">${nf(mt.kcal)} kcal</div>
      </div>`;
    if (!ml.length) {
      html += `<div class="empty">Nema unosa</div>`;
    } else {
      ml.forEach(e => { html += entryRow(e); });
    }
    html += `<button class="addbtn" onclick="openEntry({date:'${currentDate}',meal:'${m.id}'})">+ Dodaj · ${m.label}</button>
    </section>`;
  });

  return html;
}

function entryRow(e) {
  const x = entryMacros(e);
  return `<div class="erow">
    <div>
      <div class="ename">${esc(e.name)}${e.foodId ? ' <span class="star" title="spremljeno u Moje namirnice">' + ICON.star + '</span>' : ""}</div>
      <div class="emac">masti ${nf(x.fat, 1)} · uh ${nf(x.carbs, 1)} · vlakna ${nf(x.fiber, 1)} · proteini ${nf(x.protein, 1)} g</div>
    </div>
    <div>
      <div class="ekcal">${nf(x.kcal)} kcal</div>
      <div class="egrams">${nf(e.grams)} g · ${nf((e.per100 || {}).kcal)} kcal/100g</div>
    </div>
    <div class="eact">
      <button class="mini" title="Uredi" onclick="openEntry({date:'${currentDate}',meal:'${e.meal}',entryId:'${e.id}'})">${ICON.pencil}</button>
      <button class="mini" title="Obriši" onclick="delEntry('${e.id}')">${ICON.x}</button>
    </div>
  </div>`;
}

/* ---------- MODAL ZA UNOS ---------- */
let modalCtx = null;

function openEntry(opts) {
  opts = opts || {};
  const date = opts.date || currentDate;
  const list = dayEntries(date);
  let entry = null;
  if (opts.entryId) entry = list.find(x => x.id === opts.entryId) || null;

  let name = "", p = { kcal: "", fat: "", carbs: "", fiber: "", protein: "" }, grams = "", meal = opts.meal || "breakfast", foodId = "";

  if (entry) {
    name = entry.name;
    p = entry.per100 || p;
    grams = entry.grams;
    meal = entry.meal;
    foodId = entry.foodId || "";
  } else if (opts.food) {
    name = opts.food.name;
    p = opts.food.per100;
    foodId = opts.food.id;
  }

  modalCtx = { date, entryId: entry ? entry.id : null, foodId: foodId };

  const modal = $("#modal");
  modal.innerHTML = `<form class="modalbox" onsubmit="submitEntry(event)">
    <h3>${entry ? "Uredi unos" : "Novi unos"} <span class="muted" style="font-weight:500;font-size:12.5px">· ${shortDate(date)}</span></h3>

    <label class="fld"><span>Namirnica / jelo</span>
      <input id="f-name" type="text" list="foodlist" autocomplete="off" value="${esc(name)}" placeholder="npr. Pileća prsa" oninput="onNameInput()" ${entry ? "" : "autofocus"}>
    </label>
    <datalist id="foodlist">${state.foods.map(f => `<option value="${esc(f.name)}"></option>`).join("")}</datalist>
    <div class="libhint" id="libhint"></div>

    <div class="frow5">
      <label class="fld"><span>kcal /100g</span><input id="f-kcal" type="text" inputmode="decimal" value="${p.kcal === 0 ? "0" : (p.kcal || "")}" oninput="updatePreview()"></label>
      <label class="fld"><span>masti g</span><input id="f-fat" type="text" inputmode="decimal" value="${p.fat === 0 ? "0" : (p.fat || "")}" oninput="updatePreview()"></label>
      <label class="fld"><span>uh g</span><input id="f-carbs" type="text" inputmode="decimal" value="${p.carbs === 0 ? "0" : (p.carbs || "")}" oninput="updatePreview()"></label>
      <label class="fld"><span>vlakna g</span><input id="f-fiber" type="text" inputmode="decimal" value="${p.fiber === 0 ? "0" : (p.fiber || "")}" oninput="updatePreview()"></label>
      <label class="fld"><span>proteini g</span><input id="f-protein" type="text" inputmode="decimal" value="${p.protein === 0 ? "0" : (p.protein || "")}" oninput="updatePreview()"></label>
    </div>

    <div class="frow">
      <label class="fld"><span>Pojela sam (g)</span><input id="f-grams" type="text" inputmode="decimal" placeholder="npr. 137" value="${grams}" oninput="updatePreview()"></label>
      <label class="fld"><span>Obrok</span>
        <select id="f-meal">${MEALS.map(m => `<option value="${m.id}" ${m.id === meal ? "selected" : ""}>${m.label}</option>`).join("")}</select>
      </label>
    </div>

    <div class="preview" id="prev"></div>

    <label class="check" for="f-save">
      <input id="f-save" type="checkbox" ${entry && entry.foodId ? "checked" : ""}>
      <span>
        <span class="ct">Spremi u Moje namirnice</span>
        <span class="cd">Zadano je ISKLJUČENO — unos se ne pamti nigdje osim u ovom danu. Ako uključiš, unos će dobiti ★ i namirnica ide u tvoj vlastiti popis (na 100 g).</span>
      </span>
    </label>

    <div class="btnrow" style="justify-content:flex-end;margin-top:16px">
      <button type="button" class="btn ghost" onclick="closeModal()">Odustani</button>
      <button type="submit" class="btn">Spremi</button>
    </div>
  </form>`;

  modal.classList.remove("hidden");
  updatePreview();
}

function closeModal() {
  $("#modal").classList.add("hidden");
  $("#modal").innerHTML = "";
  modalCtx = null;
}

function updatePreview() {
  const el = $("#prev");
  if (!el) return;
  const g = parseNum($("#f-grams").value);
  const f = g / 100;
  const p = {
    kcal: parseNum($("#f-kcal").value), fat: parseNum($("#f-fat").value),
    carbs: parseNum($("#f-carbs").value), fiber: parseNum($("#f-fiber").value),
    protein: parseNum($("#f-protein").value)
  };
  el.innerHTML = `<div class="pv-main">${nf(p.kcal * f)} <span>kcal</span></div>
    <div class="pv-mac">${nf(g)} g → masti ${nf(p.fat * f, 1)} · uh ${nf(p.carbs * f, 1)} · vlakna ${nf(p.fiber * f, 1)} · proteini ${nf(p.protein * f, 1)} g</div>`;
}

function onNameInput() {
  const val = $("#f-name").value.trim().toLowerCase();
  const hint = $("#libhint");
  const found = state.foods.find(f => f.name.trim().toLowerCase() === val);
  if (!found) { hint.textContent = ""; modalCtx.foodId = null; return; }
  modalCtx.foodId = found.id;
  const map = [["f-kcal", "kcal"], ["f-fat", "fat"], ["f-carbs", "carbs"], ["f-fiber", "fiber"], ["f-protein", "protein"]];
  map.forEach(([id, key]) => {
    const inp = $("#" + id);
    if (inp && String(inp.value).trim() === "") inp.value = found.per100[key];
  });
  hint.textContent = "✓ Popunjeno iz tvojih namirnica (★)";
  updatePreview();
}

function submitEntry(ev) {
  ev.preventDefault();
  const name = $("#f-name").value.trim();
  if (!name) { alert("Upiši naziv namirnice."); return; }

  const per100 = {
    kcal: parseNum($("#f-kcal").value), fat: parseNum($("#f-fat").value),
    carbs: parseNum($("#f-carbs").value), fiber: parseNum($("#f-fiber").value),
    protein: parseNum($("#f-protein").value)
  };
  const grams = parseNum($("#f-grams").value);
  if (!(grams > 0)) { alert("Upiši koliko grama si pojela (više od 0)."); return; }

  const meal = $("#f-meal").value;
  const saveToLib = $("#f-save").checked;
  let foodId = modalCtx.foodId || null;

  if (saveToLib) {
    foodId = upsertFood(name, per100);
  }

  const date = modalCtx.date;
  if (!state.entries[date]) state.entries[date] = [];

  // ★ se stavlja samo ako je namirnica stvarno na popisu (novo spremljena ili već postoji)
  const linkedFoodId = saveToLib ? foodId : (modalCtx.foodId || null);

  if (modalCtx.entryId) {
    const e = state.entries[date].find(x => x.id === modalCtx.entryId);
    if (e) {
      e.name = name; e.per100 = per100; e.grams = grams; e.meal = meal;
      e.foodId = linkedFoodId;
    }
    toast("Unos ažuriran");
  } else {
    state.entries[date].push({
      id: uid(), name, per100, grams, meal,
      foodId: linkedFoodId,
      createdAt: new Date().toISOString()
    });
    toast(saveToLib ? "Dodano + spremljeno u namirnice ★" : "Dodano");
  }

  save();
  closeModal();
  currentDate = date;
  render();
}

function upsertFood(name, per100) {
  const found = state.foods.find(f => f.name.trim().toLowerCase() === name.trim().toLowerCase());
  if (found) {
    found.per100 = per100;
    found.updatedAt = new Date().toISOString();
    return found.id;
  }
  const f = { id: uid(), name: name.trim(), per100, savedAt: new Date().toISOString() };
  state.foods.push(f);
  return f.id;
}

function delEntry(id) {
  const list = state.entries[currentDate] || [];
  const e = list.find(x => x.id === id);
  if (!e) return;
  if (!confirm("Obrisati unos \"" + e.name + "\"?")) return;
  state.entries[currentDate] = list.filter(x => x.id !== id);
  save();
  render();
  toast("Obrisano");
}

/* ---------- KALENDAR ---------- */
function calShift(n) {
  const p = calMonth.split("-").map(Number);
  const d = new Date(p[0], p[1] - 1 + n, 1);
  calMonth = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  render();
}

function viewCalendar() {
  const parts = calMonth.split("-").map(Number);
  const y = parts[0], m = parts[1];
  const first = new Date(y, m - 1, 1);
  const startIdx = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m, 0).getDate();
  const goal = Number(state.settings.kcalGoal) || 0;

  let loggedDays = 0, sumKcal = 0, cells = "";

  for (let i = 0; i < startIdx; i++) cells += `<div class="cday pad"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const ds = y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    const t = totalsOf(dayEntries(ds));
    const has = (state.entries[ds] || []).length > 0;
    let cls = "empty";
    if (has) {
      loggedDays++; sumKcal += t.kcal;
      const r = goal > 0 ? t.kcal / goal : 0;
      cls = goal > 0 ? (r <= 0.85 ? "good" : (r <= 1.05 ? "near" : "over")) : "good";
    }
    if (ds === todayStr()) cls += " today";
    cells += `<button class="cday ${cls}" onclick="goDay('${ds}')" title="${shortDate(ds)}${has ? " · " + nf(t.kcal) + " kcal" : ""}">
      <span class="cnum">${d}</span>
      ${has ? `<span class="ckcal">${nf(t.kcal)}</span>` : ""}
      ${state.weights[ds] ? `<span class="wd" title="vaganje"></span>` : ""}
    </button>`;
  }

  const avg = loggedDays ? sumKcal / loggedDays : 0;

  return `<div class="card">
    <div class="calhead">
      <button class="navbtn" onclick="calShift(-1)">‹</button>
      <div class="mtitle">${MONTHS_NOM[m - 1]} ${y}</div>
      <button class="navbtn" onclick="calShift(1)">›</button>
    </div>
    <div class="dow">${["Pon","Uto","Sri","Čet","Pet","Sub","Ned"].map(x => `<div>${x}</div>`).join("")}</div>
    <div class="cgrid">${cells}</div>
    <div class="legend">
      <span><i style="background:rgba(143,224,74,.6)"></i>u cilju</span>
      <span><i style="background:rgba(255,192,58,.6)"></i>blizu cilja</span>
      <span><i style="background:rgba(255,107,107,.6)"></i>preko cilja</span>
      <span><i style="background:#141815;box-shadow:inset 0 0 0 1px #2a312b"></i>bez unosa</span>
      <span><i style="background:var(--teal);border-radius:50%;width:7px;height:7px"></i>vaganje</span>
    </div>
  </div>
  <div class="card">
    <h2>Ovaj mjesec</h2>
    <div class="grid4" style="grid-template-columns:repeat(3,1fr);margin:0">
      <div class="stat"><div class="sl">Dana s unosom</div><div class="sv">${loggedDays}</div></div>
      <div class="stat"><div class="sl">Prosjek kcal</div><div class="sv">${nf(avg)}</div></div>
      <div class="stat"><div class="sl">Ukupno kcal</div><div class="sv">${nf(sumKcal)}</div></div>
    </div>
    <div class="muted" style="margin-top:12px">Klikni na dan da vidiš ili urediš unos.</div>
  </div>`;
}

/* ---------- NAMIRNICE ---------- */
function viewFoods() {
  let html = `<div class="card">
    <h2>Moje namirnice (vlastiti popis, vrijednosti na 100 g)</h2>`;
  if (!state.foods.length) {
    html += `<div class="muted">Popis je prazan. Namirnice se ovdje pojavljuju samo kad ti to eksplicitno tražiš — kvačica <b>„Spremi u Moje namirnice“</b> u prozoru za unos. Ništa se ne sprema automatski.</div>`;
  } else {
    state.foods.slice().sort((a, b) => a.name.localeCompare(b.name, "hr")).forEach(f => {
      html += `<div class="foodrow">
        <div>
          <div class="fname">${esc(f.name)} <span class="tag">★ ručno spremljeno</span></div>
          <div class="fmac">${nf(f.per100.kcal)} kcal · masti ${nf(f.per100.fat, 1)} · uh ${nf(f.per100.carbs, 1)} · vlakna ${nf(f.per100.fiber, 1)} · proteini ${nf(f.per100.protein, 1)} g / 100 g</div>
        </div>
        <div class="btnrow" style="margin:0">
          <button class="btn ghost small" onclick="addFromFood('${f.id}')">+ Danas</button>
          <button class="mini" title="Obriši" onclick="delFood('${f.id}')">${ICON.x}</button>
        </div>
      </div>`;
    });
  }
  html += `</div>
  <div class="card">
    <h2>Dodaj namirnicu na popis</h2>
    <label class="fld"><span>Naziv</span><input id="nf-name" type="text" placeholder="npr. Grčki jogurt 2%"></label>
    <div class="frow5">
      <label class="fld"><span>kcal /100g</span><input id="nf-kcal" type="text" inputmode="decimal"></label>
      <label class="fld"><span>masti g</span><input id="nf-fat" type="text" inputmode="decimal"></label>
      <label class="fld"><span>uh g</span><input id="nf-carbs" type="text" inputmode="decimal"></label>
      <label class="fld"><span>vlakna g</span><input id="nf-fiber" type="text" inputmode="decimal"></label>
      <label class="fld"><span>proteini g</span><input id="nf-protein" type="text" inputmode="decimal"></label>
    </div>
    <button class="btn" onclick="addFoodManual()">Dodaj na popis</button>
  </div>`;
  return html;
}

function addFoodManual() {
  const name = $("#nf-name").value.trim();
  if (!name) { alert("Upiši naziv namirnice."); return; }
  const per100 = {
    kcal: parseNum($("#nf-kcal").value), fat: parseNum($("#nf-fat").value),
    carbs: parseNum($("#nf-carbs").value), fiber: parseNum($("#nf-fiber").value),
    protein: parseNum($("#nf-protein").value)
  };
  upsertFood(name, per100);
  save();
  render();
  toast("Namirnica dodana ★");
}

function delFood(id) {
  const f = state.foods.find(x => x.id === id);
  if (!f) return;
  if (!confirm("Obrisati \"" + f.name + "\" iz popisa? (Dosadašnji unosi ostaju nepromijenjeni.)")) return;
  state.foods = state.foods.filter(x => x.id !== id);
  save();
  render();
  toast("Obrisano iz popisa");
}

function addFromFood(id) {
  const f = state.foods.find(x => x.id === id);
  if (!f) return;
  openEntry({ date: currentDate, meal: "lunch", food: f });
}

/* ---------- TEŽINA ---------- */
function viewWeight() {
  const bmi = bmiInfo();
  const lw = latestWeight();
  const fw = firstWeight();
  const s = state.settings;
  const start = s.startWeight ? Number(s.startWeight) : (fw ? fw.kg : null);
  const goal = s.goalWeight ? Number(s.goalWeight) : null;
  const cur = lw ? lw.kg : null;

  let html = "";

  html += `<div class="card">
    <h2>Moj BMI</h2>`;
  if (!bmi) {
    html += `<div class="muted">Upiši visinu u kartici <b>Ciljevi</b>${!lw ? " i dodaj barem jedno vaganje" : ""} da bi se izračunao BMI.</div>`;
  } else {
    html += `<div class="bmi">
      <div>
        <div class="val">${nf(bmi.bmi, 1)}</div>
        <div class="muted" style="font-size:12px">BMI · ${nf(cur, 1)} kg / ${nf(s.height)} cm</div>
      </div>
      <span class="pill ${bmi.cls}">${bmi.label}</span>
    </div>
    <div class="bar" style="margin-top:14px"><i style="width:${Math.min(100, (bmi.bmi / 40) * 100)}%;background:${bmi.cls === "n" ? "var(--acc)" : (bmi.cls === "b" ? "var(--teal)" : "var(--amber)")}"></i></div>
    <div class="muted" style="font-size:11.5px;margin-top:5px">18,5 — 24,9 = normalno</div>`;
  }
  html += `</div>`;

  if (start !== null && cur !== null) {
    const lost = start - cur;
    let prog = 0;
    if (goal !== null && start !== goal) prog = Math.max(0, Math.min(100, (lost / (start - goal)) * 100));
    html += `<div class="card">
      <h2>Praćenje kilaže</h2>
      <div class="grid4" style="grid-template-columns:repeat(3,1fr);margin:0 0 12px">
        <div class="stat"><div class="sl">Start</div><div class="sv">${nf(start, 1)}<em>kg</em></div><div class="st">${s.startWeight ? "ručno" : (fw ? shortDate(fw.date) : "")}</div></div>
        <div class="stat"><div class="sl">Sad</div><div class="sv">${nf(cur, 1)}<em>kg</em></div><div class="st">${lw ? shortDate(lw.date) : ""}</div></div>
        <div class="stat"><div class="sl">Cilj</div><div class="sv">${goal !== null ? nf(goal, 1) : "—"}<em>${goal !== null ? "kg" : ""}</em></div><div class="st">${goal !== null ? "do cilja " + nf(Math.max(0, cur - goal), 1) + " kg" : "postavi u Ciljevi"}</div></div>
      </div>
      <div class="muted" style="font-size:13px">${lost >= 0 ? "Izgubila si <b style='color:var(--acc)'>" + nf(lost, 1) + " kg</b> od početka." : "Dobila si <b style='color:var(--amber)'>" + nf(-lost, 1) + " kg</b> od početka."}</div>
      ${goal !== null ? `<div class="bar" style="margin-top:10px"><i style="width:${prog}%"></i></div><div class="muted" style="font-size:11.5px;margin-top:5px">${nf(prog)} % puta do cilja</div>` : ""}
      ${weightChart()}
    </div>`;
  }

  html += `<div class="card">
    <h2>Novo vaganje</h2>
    <div class="frow">
      <label class="fld"><span>Datum</span><input id="w-date" type="date" value="${todayStr()}"></label>
      <label class="fld"><span>Težina (kg)</span><input id="w-kg" type="text" inputmode="decimal" placeholder="npr. 68,4"></label>
    </div>
    <button class="btn" onclick="addWeight()">Spremi vaganje</button>
  </div>`;

  const dates = sortedWeightDates().reverse();
  html += `<div class="card">
    <h2>Povijest vaganja (${dates.length})</h2>`;
  if (!dates.length) html += `<div class="muted">Još nema zapisa.</div>`;
  dates.forEach((d, i) => {
    const kg = Number(state.weights[d]);
    const prev = dates[i + 1] ? Number(state.weights[dates[i + 1]]) : null;
    const delta = prev !== null ? kg - prev : null;
    const dcls = delta === null ? "zero" : (delta < -0.05 ? "down" : (delta > 0.05 ? "up" : "zero"));
    const dtxt = delta === null ? "—" : ((delta > 0 ? "+" : "") + nf(delta, 1) + " kg");
    html += `<div class="wrow">
      <div>${shortDate(d)} <span class="muted" style="font-size:11.5px">${DAYS_SHORT[parseDate(d).getDay()]}</span></div>
      <div style="font-weight:700">${nf(kg, 1)} kg</div>
      <div class="delta ${dcls}">${dtxt}</div>
      <button class="mini" onclick="delWeight('${d}')">${ICON.x}</button>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function addWeight() {
  const d = $("#w-date").value;
  const kg = parseNum($("#w-kg").value);
  if (!d) { alert("Odaberi datum."); return; }
  if (!(kg > 0)) { alert("Upiši težinu u kg."); return; }
  state.weights[d] = kg;
  save();
  render();
  toast("Vaganje spremljeno");
}

function delWeight(d) {
  if (!confirm("Obrisati vaganje za " + shortDate(d) + "?")) return;
  delete state.weights[d];
  save();
  render();
}

function weightChart() {
  const dates = sortedWeightDates();
  if (dates.length < 2) return `<div class="muted" style="margin-top:14px;font-size:12.5px">Graf se prikazuje od dva vaganja.</div>`;
  const pts = dates.map(d => ({ d, w: Number(state.weights[d]) }));
  const W = 640, H = 190, PL = 40, PR = 14, PT = 16, PB = 26;
  const ws = pts.map(p => p.w);
  let min = Math.min.apply(null, ws), max = Math.max.apply(null, ws);
  if (max - min < 2) { min -= 1; max += 1; }
  const span = max - min;
  const x = i => PL + i * (W - PL - PR) / (pts.length - 1);
  const y = w => PT + (1 - (w - min) / span) * (H - PT - PB);

  let grid = "";
  for (let i = 0; i <= 3; i++) {
    const val = min + span * (i / 3);
    const yy = y(val);
    grid += `<line x1="${PL}" y1="${yy}" x2="${W - PR}" y2="${yy}" stroke="#252c26" stroke-width="1"/>
      <text x="${PL - 7}" y="${yy + 3.5}" fill="#8d9a90" font-size="10" text-anchor="end">${nf(val, 1)}</text>`;
  }

  const goal = state.settings.goalWeight ? Number(state.settings.goalWeight) : null;
  let goalLine = "";
  if (goal !== null && goal >= min && goal <= max) {
    goalLine = `<line x1="${PL}" y1="${y(goal)}" x2="${W - PR}" y2="${y(goal)}" stroke="#4ad9c0" stroke-dasharray="5 5" stroke-width="1.5"/>
      <text x="${W - PR}" y="${y(goal) - 5}" fill="#4ad9c0" font-size="10" text-anchor="end">cilj ${nf(goal, 1)}</text>`;
  }

  const line = pts.map((p, i) => x(i) + "," + y(p.w)).join(" ");
  const area = `M ${x(0)},${H - PB} L ` + pts.map((p, i) => x(i) + "," + y(p.w)).join(" L ") + ` L ${x(pts.length - 1)},${H - PB} Z`;
  const dots = pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.w)}" r="3.2" fill="#8fe04a"/>`).join("");
  const labels = `<text x="${PL}" y="${H - 6}" fill="#8d9a90" font-size="10">${shortDate(pts[0].d)}</text>
    <text x="${W - PR}" y="${H - 6}" fill="#8d9a90" font-size="10" text-anchor="end">${shortDate(pts[pts.length - 1].d)}</text>`;

  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graf težine">
    <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fe04a" stop-opacity=".28"/><stop offset="100%" stop-color="#8fe04a" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}${goalLine}
    <path d="${area}" fill="url(#wg)"/>
    <polyline points="${line}" fill="none" stroke="#8fe04a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}
  </svg></div>`;
}

/* ---------- CILJEVI ---------- */
function viewSettings() {
  const s = state.settings;
  return `<form class="card" onsubmit="saveSettings(event)">
    <h2>Moj profil</h2>
    <div class="frow3">
      <label class="fld"><span>Visina (cm)</span><input id="s-height" type="text" inputmode="decimal" value="${s.height || ""}" placeholder="170"></label>
      <label class="fld"><span>Početna težina (kg)</span><input id="s-start" type="text" inputmode="decimal" value="${s.startWeight || ""}" placeholder="prazno = prvo vaganje"></label>
      <label class="fld"><span>Ciljna težina (kg)</span><input id="s-goalw" type="text" inputmode="decimal" value="${s.goalWeight || ""}" placeholder="65"></label>
    </div>

    <h2 style="margin-top:18px">Dnevni ciljevi</h2>
    <div class="frow5">
      <label class="fld"><span>kcal</span><input id="s-kcal" type="text" inputmode="decimal" value="${s.kcalGoal || ""}"></label>
      <label class="fld"><span>masti g</span><input id="s-fat" type="text" inputmode="decimal" value="${s.fatGoal || ""}"></label>
      <label class="fld"><span>uh g</span><input id="s-carbs" type="text" inputmode="decimal" value="${s.carbGoal || ""}"></label>
      <label class="fld"><span>vlakna g</span><input id="s-fiber" type="text" inputmode="decimal" value="${s.fiberGoal || ""}"></label>
      <label class="fld"><span>proteini g</span><input id="s-protein" type="text" inputmode="decimal" value="${s.proteinGoal || ""}"></label>
    </div>
    <div class="muted" style="font-size:12px;margin-bottom:10px">Napiši 0 ili ostavi prazno ako ne želiš cilj za taj nutrijent.</div>
    <div class="btnrow">
      <button class="btn" type="submit">Spremi ciljeve</button>
      <button class="btn ghost" type="button" onclick="suggestMacros()">Predloži raspodjelu (30 % M / 40 % UH / 30 % P)</button>
    </div>
  </form>

  <div class="card">
    <h2>Podaci</h2>
    <div class="muted" style="font-size:12.5px;margin-bottom:12px">Sve se čuva samo u ovom pregledniku (localStorage). Napravi backup prije čišćenja povijesti ili mijenjanja uređaja.</div>
    <div class="btnrow">
      <button class="btn ghost small" onclick="exportData()">⬇ Izvezi backup (.json)</button>
      <label class="btn ghost small" style="display:inline-block;margin:0">⬆ Uvezi backup
        <input type="file" accept="application/json,.json" onchange="importData(event)" style="display:none">
      </label>
      <button class="btn danger small" onclick="resetAll()">Obriši sve podatke</button>
    </div>
  </div>`;
}

function saveSettings(ev) {
  ev.preventDefault();
  state.settings.height = parseNum($("#s-height").value) || null;
  state.settings.startWeight = parseNum($("#s-start").value) || null;
  state.settings.goalWeight = parseNum($("#s-goalw").value) || null;
  state.settings.kcalGoal = parseNum($("#s-kcal").value);
  state.settings.fatGoal = parseNum($("#s-fat").value);
  state.settings.carbGoal = parseNum($("#s-carbs").value);
  state.settings.fiberGoal = parseNum($("#s-fiber").value);
  state.settings.proteinGoal = parseNum($("#s-protein").value);
  save();
  render();
  toast("Ciljevi spremljeni");
}

function suggestMacros() {
  const kcal = parseNum($("#s-kcal").value) || 2000;
  $("#s-fat").value = Math.round(kcal * 0.30 / 9);
  $("#s-carbs").value = Math.round(kcal * 0.40 / 4);
  $("#s-protein").value = Math.round(kcal * 0.30 / 4);
  $("#s-fiber").value = Math.round(kcal / 1000 * 14);
  toast("Prijedlog upisan — klikni Spremi");
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "kalorije-backup-" + todayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast("Backup preuzet");
}

function importData(ev) {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || typeof d !== "object") throw new Error("Neispravna datoteka");
      state = {
        entries: d.entries && typeof d.entries === "object" ? d.entries : {},
        foods: Array.isArray(d.foods) ? d.foods : [],
        weights: d.weights && typeof d.weights === "object" ? d.weights : {},
        settings: Object.assign({}, DEFAULT_SETTINGS, d.settings || {})
      };
      save();
      render();
      toast("Podaci uvezeni");
    } catch (e) {
      alert("Greška pri uvozu: " + e.message);
    }
  };
  r.readAsText(f);
  ev.target.value = "";
}

function resetAll() {
  if (!confirm("Obrisati SVE unose, namirnice i vaganja? Ovo se ne može poništiti.")) return;
  if (!confirm("Sigurno? Zadnja šansa.")) return;
  state = { entries: {}, foods: [], weights: {}, settings: Object.assign({}, DEFAULT_SETTINGS) };
  save();
  render();
  toast("Sve obrisano");
}

/* ============================================================
   START
   ============================================================ */
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
render();

// PWA: radi i offline kad je hostano (na file:// se preskače)
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
